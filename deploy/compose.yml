name: entity-core

services:
  entity-core-api:
    build:
      context: ..
      dockerfile: deploy/docker/entity-core-api/Dockerfile
    image: entity-core-api:local
    env_file:
      - ./env/entity-core-api.env
      - ./env/postgres.env
    restart: unless-stopped
    ports:
      - "127.0.0.1:8004:8004"
    networks:
      - shared-net

  entity-core:
    build:
      context: ..
      dockerfile: deploy/docker/entity-core/Dockerfile
    image: entity-core:local
    env_file:
      - ./env/entity-core.env
    restart: unless-stopped
    ports:
      - "127.0.0.1:3006:3006"
    networks:
      - shared-net