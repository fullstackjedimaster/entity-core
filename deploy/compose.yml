name: entity-core

services:
  postgres:
    image: postgres:16
    tmpfs:
      - /var/lib/postgresql/data
    env_file:
      - ./env/postgres.env
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 60

  bootstrap:
    build:
      context: .
      dockerfile: docker/bootstrap/Dockerfile
      additional_contexts:
        repo: ..
    image: entity-core-api/bootstrap:local
    env_file:
      - ./env/postgres.env
      - ./env/entity-core-api.env
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - bash
      - -lc
      - |
        set -euxo pipefail
        /scripts/init-postgres.sh
    restart: "no"

  entity-core-api:
    build:
      context: .
      dockerfile: docker/entity-core-api/Dockerfile
      additional_contexts:
        repo: ..
    image: entity-core-api:local
    env_file:
      - ./env/entity-core-api.env
      - ./env/postgres.env
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped
    ports:
      - "127.0.0.1:8005:8005"

  entity-core:
    build:
      context: .
      dockerfile: docker/entity-core/Dockerfile
      args:
        NEXT_PUBLIC_ENTITY_CORE_API_BASE_URL: "https://entity-core.fullstackjedi.dev/api"
        NEXT_PUBLIC_AUTH0_DOMAIN: "dev-gttnobig6h3trkvm.us.auth0.com"
        NEXT_PUBLIC_AUTH0_CLIENT_ID: "9J5htp4HKGaUV58ZX9E8FQ2ldot7SnkO"
        NEXT_PUBLIC_AUTH0_AUDIENCE: "https://entity-core.fullstackjedi.dev/api"
        NEXT_PUBLIC_AUTH0_NAMESPACE: "https://fullstackjedi.dev"
        NEXT_PUBLIC_AUTH0_SCOPE: "openid profile email crud:read crud:create crud:update crud:delete offline_access"
        NEXT_PUBLIC_AUTH0_REDIRECT_URI: "https://entity-core.fullstackjedi.dev/callback"
        NEXT_PUBLIC_DISABLE_AUTH: "false"
      additional_contexts:
        repo: ..
    image: entity-core:local
    env_file:
      - ./env/entity-core.env
    restart: unless-stopped
    ports:
      - "127.0.0.1:3006:3006"